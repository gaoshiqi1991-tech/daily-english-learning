# ===== 全局配置 =====

# OpenAI 兼容接口设置（API Key 从环境变量 OPENAI_API_KEY 读取）
openai:
  model: "deepseek-chat"        # DeepSeek 模型；也可设环境变量 OPENAI_MODEL 覆盖
  base_url: null                # null 时读取环境变量 OPENAI_BASE_URL（如 https://api.deepseek.com/v1）
  temperature: 0.4

# 每日新闻 RSS 源（经济 + 健康，权威外刊）
news_feeds:
  - name: "BBC Business"
    url: "https://feeds.bbci.co.uk/news/business/rss.xml"
  - name: "BBC Health"
    url: "https://feeds.bbci.co.uk/news/health/rss.xml"
  - name: "The Guardian Business"
    url: "https://www.theguardian.com/uk/business/rss"
  - name: "The Guardian Health"
    url: "https://www.theguardian.com/society/health/rss"
  - name: "NYT Business"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"
  - name: "NPR Health"
    url: "https://feeds.npr.org/1128/rss.xml"

# 知识库一：最新新闻资讯 / 科学报刊（每周刷新）
kb_feeds:
  - name: "BBC Science & Environment"
    url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
  - name: "The Guardian Science"
    url: "https://www.theguardian.com/science/rss"
  - name: "ScienceDaily Top"
    url: "https://www.sciencedaily.com/rss/top/science.xml"
  - name: "Nature News"
    url: "https://www.nature.com/nature.rss"
  - name: "Scientific American"
    url: "https://www.scientificamerican.com/feed/"

# 每日抓取与生成参数
pipeline:
  news_items_per_feed: 3        # 每个 RSS 源取前几条
  news_max_total: 10            # 每日新闻摘要总条数
  kb_items_per_day: 3           # 每日随机知识条数
  vocab_count: 3                # 今日词汇单词数
  kb_max_entries: 200           # 新闻知识库最大保留条数（滚动淘汰）
  request_timeout: 20           # HTTP 请求超时（秒）

# 路径
paths:
  data_dir: "data"
  kb_news_file: "data/kb_news.json"
  kb_books_dir: "data/books"        # 书本知识库：放置你的读书笔记 .md 文件
  output_dir: "output"
  template_file: "templates/page.html"
